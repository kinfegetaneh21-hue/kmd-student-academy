    <!-- GitHub Pages SPA redirect: restores the original path after the 404.html bounce -->
    <script>
      (function () {
        var l = window.location;
        if (l.search && l.search.indexOf('?/') === 1) {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          var path = '/' + decoded.slice(1);
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + path + l.hash);
        }
      })();
    </script>
